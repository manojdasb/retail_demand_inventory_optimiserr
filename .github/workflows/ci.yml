name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt && pip install -e .
      - name: Unit tests
        run: pytest -q
      - name: End-to-end pipeline smoke run
        run: python -m rdio.pipeline --out reports --n-skus 6 --n-stores 2 --days 400
